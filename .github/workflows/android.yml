name: Build APK
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - name: Install model
        run: |
          mkdir -p android/SherpaOnnxSimulateStreamingAsr/app/src/main/assets
          cp -r android/SherpaOnnxJavaDemo/app/src/main/assets/vosk-model-streaming-ru \
                android/SherpaOnnxSimulateStreamingAsr/app/src/main/assets/
      - name: Build
        run: |
          cd android/SherpaOnnxSimulateStreamingAsr
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sherpa-streaming-apk
          path: android/SherpaOnnxSimulateStreamingAsr/app/build/outputs/apk/debug/*.apk
